name: Bug report
description: Report a calculator, auditor, validator, or documentation bug.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include private designs, credentials, or supplier account data.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command or input
      description: Include the exact command or synthetic reproduction.
      render: shell
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: v3.0.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Windows 11, Python 3.12
    validations:
      required: true
